# -*- conf -*-
# kitty — графитовая тема в тон foot (~/.config/foot/foot.ini):
#   фон #181818, текст #e6e6e6, акцент #9a9a9a
# Полный список опций: man kitty.conf

# ── Шрифт (как в foot) ──────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# ── Отступы от краёв окна (foot: pad=8x6) ───────────────────
window_padding_width 8 6

# Лёгкая прозрачность, как в foot (alpha=0.88).
# Работает только при запущенном композиторе (picom / Hyprland).
background_opacity 0.88

# ── Курсор: блок, тёмная буква на сером блоке ───────────────
cursor_shape           block
# Плавное мигание: прозрачность курсора анимируется по кривой ease-in-out
cursor_blink_interval  0.4 ease-in-out
cursor                 #9a9a9a
cursor_text_color      #181818

# ── Выделение: серый блок, тёмный текст — как в foot/rofi ───
selection_background #9a9a9a
selection_foreground #181818

# ── Ссылки: Ctrl+клик открывает, пунктирное подчёркивание ───
detect_urls yes
url_style   dotted
url_color   #8296b8

# ── Скроллбэк (foot: lines=4000) ────────────────────────────
scrollback_lines 4000

# Копирование/вставка — дефолтные: Ctrl+Shift+C / Ctrl+Shift+V

# ── Палитра «Graphite» (как в foot colors-dark) ─────────────
foreground #e6e6e6
background #181818

## Обычные цвета (0-7)
color0 #1f1f1f   # black
color1 #b87a7a   # red     (приглушённая роза)
color2 #8fa87a   # green   (олива)
color3 #c9ad7a   # yellow  (тёплый песок)
color4 #8296b8   # blue    (серо-голубой)
color5 #b28ab2   # magenta (пыльная орхидея)
color6 #88b2b2   # cyan    (серо-бирюзовый)
color7 #b0b0b0   # white

## Яркие цвета (8-15)
color8  #565656  # bright black
color9  #d49090  # bright red
color10 #b3c9a0  # bright green
color11 #e0c79a  # bright yellow
color12 #a9bde0  # bright blue
color13 #d4aed4  # bright magenta
color14 #a3ccd0  # bright cyan
color15 #e6e6e6  # bright white

# ── Настройки анимации курсора (trail) ──────────────────────
# Жирный шлейф: длинный, тает медленно, срабатывает почти всегда.
# Цвет #e6e6e6 — fg палитры (светлее курсора #9a9a9a, в тон rofi/foot)
cursor_trail 30
cursor_trail_decay 0.2 0.6
cursor_trail_start_threshold 1
cursor_trail_color #e6e6e6
