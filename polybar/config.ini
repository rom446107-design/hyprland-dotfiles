; ============================================================
; Polybar — тема «Graphite», в стиле rofi (~/.config/rofi/themes/graphite.rasi)
; Непрозрачный тёмный фон, компактная высота, 1px рамка, радиус 8px.
; ============================================================

[colors]
bg         = #181818
bg-alt     = #242424
fg         = #e6e6e6
fg-muted   = #7d7d7d
accent     = #9a9a9a
accent-dim = #2e2e2e
border     = #4a4a4a
urgent     = #c26a6a

; Приглушённые акценты (палитра из foot/kitty)
; steel  = сине-серый, sand = тёплый песок,
; olive = олива, orchid = пыльная орхидея
steel  = #8296b8
sand   = #c9ad7a
olive  = #8fa87a
orchid = #b28ab2
sel-bg = #333a44

[bar/main]
; Монитор задаётся в launch.sh (по умолчанию eDP-1)
monitor  = ${env:MONITOR:eDP-1}
width    = 100%
height   = 22
; Ширина терминала: 25px с каждой стороны = 20 (gaps_out) + 5 (window_gap)
margin-left   = 25
margin-right  = 25
bottom   = false

; Вид — как у rofi
background = ${colors.bg}
foreground = ${colors.fg}
radius     = 8
border-size     = 1
border-color    = ${colors.border}
padding         = 1
module-margin   = 2

; Шрифт тот же, что в rofi
font-0 = "JetBrainsMono Nerd Font:size=9;2"

; Модули
modules-left   = bspwm playerctl
modules-center = xwindow
modules-right  = cpu memory temperature pulseaudio backlight battery xkeyboard date powermenu tray

; Курсоры как в rofi (текст/указатель)
cursor-click  = pointer
cursor-scroll = pointer

; ============================================================
; Модули
; ============================================================

; ── Рабочие столы bspwm ─────────────────────────────────────
[module/bspwm]
type = internal/bspwm

; Сфокусированный — как выбранный элемент в rofi
label-focused          = %name%
label-focused-background = ${colors.sel-bg}
label-focused-foreground = ${colors.fg}
label-focused-padding  = 1

label-occupied         = %name%
label-occupied-foreground = ${colors.fg}
label-occupied-padding = 1

label-empty            = %name%
label-empty-foreground = ${colors.fg-muted}
label-empty-padding    = 1

; Срочное окно — красный, как urgent в rofi
label-urgent           = %name%!
label-urgent-background  = ${colors.urgent}
label-urgent-foreground  = ${colors.bg}
label-urgent-padding   = 1

label-separator = " "

; ── Заголовок активного окна ────────────────────────────────
[module/xwindow]
type = internal/xwindow
label          = %title:0-64:…%
label-foreground = ${colors.fg-muted}

; ── CPU (клик — htop) ───────────────────────────────────────
[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label =  %percentage%%
click-left = kitty -e htop

; ── RAM ─────────────────────────────────────────────────────
[module/memory]
type = internal/memory
interval = 3
format = <label>
label =  %percentage_used%%

; ── Температура CPU (x86_pkg_temp), красная при перегреве ───
[module/temperature]
type = internal/temperature
thermal-zone = 3
base-temperature = 20
warn-temperature = 75
interval = 5
format = <label>
format-warn = <label-warn>
label =  %temperature-c:3%
label-warn =  %temperature-c:3%!
format-warn-foreground = ${colors.urgent}

; ── Громкость (работает с pipewire через pactl) ─────────────
[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume  =  %percentage%%
label-muted   =  mute
label-muted-foreground = ${colors.fg-muted}

; ── Яркость экрана (прокрутка мышью меняет) ─────────────────
[module/backlight]
type = internal/backlight
card = intel_backlight
enable-scroll = true
label =  %percentage%%

; ── Батарея ─────────────────────────────────────────────────
[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
full-at = 98
interval = 30

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-framerate = 750

format-discharging = <ramp-capacity> <label-discharging>
format-charging    = <animation-charging> <label-charging>
format-full        = <ramp-capacity> <label-full>

label-discharging = %percentage%%
label-charging    = %percentage%%
label-full        = %percentage%%

; ── Раскладка клавиатуры (us/ru) ────────────────────────────
[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
format = <label-layout>
label-layout = %layout%

; ── Дата/время ──────────────────────────────────────────────
[module/date]
type = internal/date
interval = 30
date  = %d.%m
time  = %H:%M
label = %date% %time%

; ── Систрей ─────────────────────────────────────────────────
[module/tray]
type = internal/tray
format-padding = 4

; ── Музыка: клик — пауза/плей, колесо — треки ───────────────
[module/playerctl]
type = custom/script
exec = ~/.config/polybar/scripts/playerctl.sh '{{ status == "Playing" ? " " : " " }} {{ title }}' 2>/dev/null || echo ""
interval = 2
format = <label>
label = %output%
label-maxlen = 24
label-ellipsis = true
click-left = playerctl play-pause
scroll-up = playerctl next
scroll-down = playerctl previous

; ── Меню питания: клик открывает rofi powermenu ─────────────
[module/powermenu]
type = custom/script
exec = echo ""
interval = 0
format = <label>
click-left = ~/.config/rofi/scripts/powermenu.sh &

[settings]
screenchange-reload = true
pseudo-transparency = false
