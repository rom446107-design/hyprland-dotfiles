# -*- conf -*-
# foot — графитовая тема, в тон rofi/themes/graphite.rasi и waybar/style.css:
#   фон #181818, текст #e6e6e6, акцент #9a9a9a
# Полный список опций: man foot.ini

[main]
font=JetBrainsMono Nerd Font:size=10

# Лёгкая прозрачность, как у rofi (bg 83%).
# Hyprland добавляет blur глобально, поэтому фон под окном размывается.
# Поставь 1.0, если непрозрачный фон читается лучше.
# alpha задаётся в [colors-dark]

# Отступы от краёв окна
pad=8x6

[cursor]
# Блок-курсор, мигающий как в большинстве терминалов
style=block
blink=yes
blink-rate=500

[url]
# Ctrl+клик мышью открывает ссылку
launch=xdg-open ${url}
style=dotted

[scrollback]
lines=4000

# Копирование/вставка — дефолтные: Ctrl+Shift+C / Ctrl+Shift+V

[colors-dark]
background=181818
foreground=e6e6e6

# 0.88 = лёгкая прозрачность (см. комментарий в [main])
alpha=0.88

# Тёмная буква на светло-сером блоке — как выделенная строка в Rofi
cursor=181818 9a9a9a

# Выделение: серый блок, тёмный текст — как selected row в Rofi
selection-background=9a9a9a
selection-foreground=181818

# Приглушённые цвета вместо ярких: Git, ls, vim и btop остаются
# читаемыми, но не «кричат» на графитовом фоне

## Обычные цвета (0-7)
regular0=1f1f1f   # black
regular1=b87a7a   # red     (приглушённая роза)
regular2=8fa87a   # green   (олива)
regular3=c9ad7a   # yellow  (тёплый песок)
regular4=8296b8   # blue    (серо-голубой)
regular5=b28ab2   # magenta (пыльная орхидея)
regular6=88b2b2   # cyan    (серо-бирюзовый)
regular7=b0b0b0   # white

## Яркие цвета (8-15)
bright0=565656    # bright black
bright1=d49090    # bright red
bright2=b3c9a0    # bright green
bright3=e0c79a    # bright yellow
bright4=a9bde0    # bright blue
bright5=d4aed4    # bright magenta
bright6=a3ccd0    # bright cyan
bright7=e6e6e6    # bright white
